const iconMap={flight:"ti-plane-departure",hotel:"ti-bed",sight:"ti-camera",food:"ti-tools-kitchen-2",temple:"ti-building-arch",nature:"ti-trees",shop:"ti-shopping-bag",museum:"ti-building",transport:"ti-train"};
const bgMap={flight:"#B5D4F4",hotel:"#9FE1CB",sight:"#85B7EB",food:"#FAC775",temple:"#F4C0D1",nature:"#C0DD97",shop:"#CECBF6",museum:"#F5C4B3",transport:"#D3D1C7"};
const fgMap={flight:"#0C447C",hotel:"#085041",sight:"#0C447C",food:"#633806",temple:"#72243E",nature:"#27500A",shop:"#3C3489",museum:"#712B13",transport:"#444441"};
const dpBgMap={flight:"#E6F1FB",hotel:"#E1F5EE",sight:"#E6F1FB",food:"#FAEEDA",temple:"#FBEAF0",nature:"#EAF3DE",shop:"#EEEDFE",museum:"#FAECE7",transport:"#F1EFE8"};

let currentFilter="all";

function buildGrid(){
  const gh=document.getElementById("grid-header");
  const tg=document.getElementById("time-grid");
  gh.innerHTML="";
  tg.innerHTML="";

  const timeH=document.createElement("div");
  timeH.style.cssText="background:transparent";
  gh.appendChild(timeH);
  days.forEach(d=>{
    const c=document.createElement("div");
    c.className="gh-cell";
    c.innerHTML=`<div class="gh-day">${d.label}</div><div class="gh-date">${d.date}</div><div style="font-size:9px;color:#378ADD">${d.sub}</div>`;
    gh.appendChild(c);
  });

  times.forEach(time=>{
    const tl=document.createElement("div");
    tl.className="time-label";
    tl.textContent=time;
    tg.appendChild(tl);

    const th=parseInt(time);
    days.forEach(d=>{
      const slot=document.createElement("div");
      slot.className="slot";
      const a=acts.find(x=>x.d===d.day && x.t===th);
      if(a){
        const act=document.createElement("div");
        act.className=`act ${a.cat}`;
        act.dataset.id=`${a.d}-${a.t}`;
        act.style.cssText=`background:${bgMap[a.cat]};color:${fgMap[a.cat]}`;
        if(currentFilter!=="all" && a.cat!==currentFilter) act.classList.add("hidden");
        act.innerHTML=`<i class="ti ${a.icon} act-icon" aria-hidden="true"></i><span class="act-label">${a.label}</span>`;
        act.addEventListener("click",()=>showDetail(a));
        slot.appendChild(act);
      } else {
        slot.classList.add("empty");
      }
      tg.appendChild(slot);
    });
  });
}

function showDetail(a){
  const dp=document.getElementById("detail-panel");
  const tagHtml=a.tags.map(t=>`<span class="dp-tag ${t.c}">${t.l}</span>`).join("");
  dp.innerHTML=`
    <div class="dp-header">
      <div class="dp-icon-wrap" style="background:${dpBgMap[a.cat]}">
        <i class="ti ${a.icon}" style="font-size:20px;color:${fgMap[a.cat]}" aria-hidden="true"></i>
      </div>
      <div>
        <div class="dp-title">${a.title}</div>
        <div class="dp-meta">${a.meta}</div>
      </div>
    </div>
    <div class="dp-desc">${a.desc}</div>
    <div class="dp-tags">${tagHtml}</div>
  `;
}

document.getElementById("filters").addEventListener("click",e=>{
  const btn=e.target.closest(".fbtn");
  if(!btn) return;
  currentFilter=btn.dataset.cat;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.querySelectorAll(".act").forEach(a=>{
    if(currentFilter==="all"||a.classList.contains(currentFilter)) a.classList.remove("hidden");
    else a.classList.add("hidden");
  });
  const visible=document.querySelectorAll(".act:not(.hidden)").length;
  document.getElementById("act-count").textContent=visible;
});

buildGrid();
</script>
